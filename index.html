<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#03111f" />
  <title>Edge Point · 布朗邻接网络</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar glass-panel">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div>
          <h1>布朗邻接网络</h1>
          <p>EDGE POINT · BROWNIAN PROXIMITY GRAPH</p>
        </div>
      </div>

      <div class="toolbar" aria-label="图参数控制">
        <label class="control">
          <span>节点</span>
          <input id="nodeCount" type="range" min="18" max="110" value="60" />
          <output id="nodeCountValue">60</output>
        </label>

        <label class="control">
          <span>连接距离</span>
          <input id="linkRadius" type="range" min="70" max="300" value="170" />
          <output id="linkRadiusValue">170</output>
        </label>

        <label class="control">
          <span>运动速度</span>
          <input id="speed" type="range" min="0" max="100" value="35" />
          <output id="speedValue">35</output>
        </label>

        <label class="control">
          <span>光迹</span>
          <input id="trail" type="range" min="0" max="100" value="10" />
          <output id="trailValue">10</output>
        </label>

        <label class="control color-control">
          <span>主色</span>
          <input id="themeColor" type="color" value="#59c9ff" aria-label="调整节点与连线主色" />
          <output id="colorValue">#59C9FF</output>
        </label>
      </div>

      <div class="actions">
        <select id="algorithm" aria-label="选择算法">
          <option value="bfs">BFS 广度优先</option>
          <option value="dfs">DFS 深度优先</option>
          <option value="dijkstra">Dijkstra 最短路</option>
        </select>
        <button id="runAlgorithm" class="primary">运行算法</button>
        <button id="regenerate">重生成</button>
        <button id="pause" aria-pressed="false">暂停</button>
      </div>
    </header>

    <section class="stage" aria-label="布朗运动动态图可视化画布">
      <canvas id="graphCanvas"></canvas>
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <div class="status-card glass-panel">
        <div class="status-dot"></div>
        <div>
          <strong id="statusTitle">BROWNIAN FIELD ACTIVE</strong>
          <span id="statusText">节点持续随机游走 · 小于连接距离时自动连线</span>
        </div>
      </div>

      <div class="legend glass-panel" aria-label="图例">
        <span><i class="legend-node normal"></i> 光点</span>
        <span><i class="legend-node start"></i> 起点</span>
        <span><i class="legend-node visited"></i> 已访问</span>
        <span><i class="legend-line"></i> 路径</span>
      </div>

      <div class="metrics glass-panel" aria-live="polite">
        <div><span>NODE</span><strong id="metricNodes">60</strong></div>
        <div><span>EDGE</span><strong id="metricEdges">0</strong></div>
        <div><span>FPS</span><strong id="metricFps">60</strong></div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
